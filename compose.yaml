services:
  app:
    build: .
    environment:
      QUIZ_PASSWORD: ${QUIZ_PASSWORD:?Set QUIZ_PASSWORD in .env}
    volumes:
      - ./students.csv:/app/students.csv:ro
      - ./data:/data
    expose:
      - "3000"
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
